# .github/workflows/ci.yml — проверки «ЧИСЛА» на каждый пуш и PR.
# Что гоняется (в том же порядке, что требует AGENTS §1.4.1 / CONTEXT §0):
#   checkall → checkcontent → unit → domtest (jsdom) → sim (баланс)
# shot.js (скриншоты) в CI не запускается: ему нужен настоящий Chrome,
# он остаётся локальным инструментом агента.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# новый пуш в ту же ветку отменяет прошлый прогон — не тратим минуты на устаревшее
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: checkall + checkcontent + unit + domtest + sim
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # puppeteer-core в devDependencies не скачивает браузер — установка дешёвая
      - name: npm ci
        run: npm ci --no-audit --no-fund

      # синтаксис, версии, ?v=, подключения скриптов, нет ESM и ^
      - name: checkall — версии и подключения
        run: node tools/checkall.js
        env:
          TOOL_LIMIT: 120

      # граф контента: дубли id, ссылки mech/res/requires, группы, startVars, деревья
      - name: checkcontent — граф контента
        run: node tools/checkcontent.js
        env:
          TOOL_LIMIT: 120

      # юнит-тесты ядра без DOM: BN, formula, digits, format, registry
      - name: unit — ядро
        run: node tools/unit.js
        env:
          TOOL_LIMIT: 120

      # D2: 8 осей, Схлопывание, связи, доски, сейв v3, симулятор баланса
      - name: d2 — тесты и симулятор
        run: node tools/tests/run-d2.js && node tools/sim-d2.js 60 0.25
        env:
          TOOL_LIMIT: 300

      # реальный UI в jsdom: цикл, доски, клики, дерево, P1, сейв, зум
      - name: domtest — UI в jsdom
        run: node tools/domtest.js
        env:
          TOOL_LIMIT: 300
          # перф-порог domtest (мс/кадр). Локально 4 мс; на общих раннерах
          # он шумит, поэтому в CI проверяем только грубые регрессии (>10x).
          PERF_MS: 40

      # баланс по формулам: печатает кривую D(t) и время до 1e308
      - name: sim — баланс
        run: node tools/sim.js 160 900
        env:
          TOOL_LIMIT: 120
