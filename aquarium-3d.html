<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Аквариум</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 30%, #12293a 0%, #08131b 45%, #02040a 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #d8eef8;
  }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.62) 100%);
  }
  .title {
    position: fixed; top: 16px; left: 22px; pointer-events: none;
    letter-spacing: .18em; text-transform: uppercase;
    font-size: 12px; color: #7fb6cf; opacity: .85;
  }
  .hint {
    position: fixed; top: 34px; left: 22px; pointer-events: none;
    font-size: 11px; color: #4d7f96; opacity: .8;
  }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px; justify-content: center;
    padding: 16px 16px 22px; pointer-events: none; flex-wrap: wrap;
  }
  .hud button {
    pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: .04em;
    padding: 9px 18px; border-radius: 999px;
    color: #cfe9f5;
    background: rgba(18, 48, 66, .55);
    border: 1px solid rgba(120, 200, 230, .28);
    backdrop-filter: blur(8px);
    transition: background .18s, border-color .18s, transform .12s;
  }
  .hud button:hover { background: rgba(30, 80, 108, .7); border-color: rgba(150, 225, 255, .55); }
  .hud button:active { transform: scale(.97); }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #03070c; z-index: 30;
    font-size: 13px; color: #6ea6bf; letter-spacing: .1em; text-align: center; padding: 24px;
    transition: opacity .6s;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(110,166,191,.25); border-top-color: #6ea6bf;
    animation: sp 1s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="overlay"><div class="spin"></div><div id="overlayText">ЗАГРУЗКА АКВАРИУМА…</div></div>
<div class="title">Аквариум 3D</div>
<div class="hint">мышь — вращение · колесо — зум · Space — покормить</div>
<div id="vignette"></div>
<div class="hud">
  <button id="btnFeed">Покормить</button>
  <button id="btnPause">Пауза</button>
  <button id="btnReset">Сброс камеры</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   0. Утилиты
   ============================================================ */
let _seed = 20240501;
function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  let sum = 0, amp = 0.5, f = 1;
  const n = oct || 4;
  for (let i = 0; i < n; i++) { sum += amp * vnoise(x * f, y * f); f *= 2; amp *= 0.5; }
  return sum;
}
function profile(keys, u) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const k0 = keys[i], k1 = keys[i + 1];
    if (u <= k1[0]) {
      let t = (u - k0[0]) / Math.max(1e-6, k1[0] - k0[0]);
      t = t * t * (3 - 2 * t);
      return k0[1] + (k1[1] - k0[1]) * t;
    }
  }
  return keys[keys.length - 1][1];
}

/* ============================================================
   1. Общие параметры
   ============================================================ */
const TANK = { w: 16, h: 9, d: 9, floor: -4.5 };
const BOUNDS = { x0: -7.2, x1: 7.2, y0: -3.6, y1: 3.4, z0: -3.4, z1: 3.4 };
const timeUniform = { value: 0 };

/* ============================================================
   2. Рендерер / сцена / камера
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0.6, 1.6, 18.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 32;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.72;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;

/* env map для отражений на чешуе / стекле */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* ============================================================
   3. Свет
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xa7d8ff, 0x18323c, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xdff2ff, 2.6);
sun.position.set(5, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -11;
sun.shadow.camera.right = 11;
sun.shadow.camera.top = 9;
sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 42;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8fd0ff, 0.85);
fill.position.set(-8, 4, -6);
scene.add(fill);

const lamp = new THREE.PointLight(0xbfe8ff, 30, 26, 2);
lamp.position.set(0, 6.5, 1.5);
scene.add(lamp);

/* ============================================================
   4. Каустика (шейдерная инъекция в материалы)
   ============================================================ */
const CAUSTIC_GLSL = `
vec2 chash(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}
float worley(vec2 p, float t) {
  vec2 n = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0, d2 = 8.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 g = vec2(float(i), float(j));
      vec2 o = chash(n + g);
      o = 0.5 + 0.5 * sin(t + 6.2831 * o);
      vec2 r = g + o - f;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
    }
  }
  return sqrt(d1);
}
float causticPattern(vec2 p, float t) {
  float a = worley(p * 1.15, t * 0.9);
  float b = worley(p * 2.35 + 13.7, t * 1.15 + 2.1);
  float c = (1.0 - a) * (1.0 - b);
  return pow(clamp(c, 0.0, 1.0), 1.6) * 1.9;
}
`;

let _progId = 0;
function uniqueKey(prefix) {
  const n = ++_progId;
  return function () { return prefix + '_' + n; };
}

function addCaustics(mat, strength, tint) {
  const uStrength = { value: strength === undefined ? 0.55 : strength };
  const uTint = { value: new THREE.Color(tint === undefined ? 0x9fe0ff : tint) };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = timeUniform;
    shader.uniforms.uCausticStrength = uStrength;
    shader.uniforms.uCausticTint = uTint;
    shader.vertexShader = 'varying vec3 vWPos;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;'
    );
    shader.fragmentShader = 'varying vec3 vWPos;\nuniform float uTime;\nuniform float uCausticStrength;\nuniform vec3 uCausticTint;\n' + CAUSTIC_GLSL + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
      {
        float cst = causticPattern(vWPos.xz * 0.62, uTime * 0.55)
                  + 0.6 * causticPattern(vWPos.xz * 1.05 + 31.0, uTime * 0.8 + 4.0);
        float hh = clamp((vWPos.y + 4.6) / 9.0, 0.0, 1.0);
        float fade = 1.0 - hh * 0.75;
        diffuseColor.rgb += uCausticTint * cst * uCausticStrength * fade * 0.16;
        diffuseColor.rgb *= 1.0 + cst * uCausticStrength * fade * 0.35;
      }`
    );
  };
  mat.customProgramCacheKey = uniqueKey('caustic');
  return mat;
}

/* ============================================================
   5. Процедурные текстуры
   ============================================================ */
function makeSandTexture() {
  const S = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const n = fbm(x * 0.011, y * 0.011, 4);
      const g = fbm(x * 0.085 + 13.7, y * 0.085 + 7.3, 3);
      const v = 146 + (n - 0.5) * 54 + (g - 0.5) * 40;
      img.data[i] = clamp(v * 1.08, 0, 255);
      img.data[i + 1] = clamp(v * 0.95, 0, 255);
      img.data[i + 2] = clamp(v * 0.74, 0, 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 7000; i++) {
    const x = Math.random() * S, y = Math.random() * S, r = 0.8 + Math.random() * 3.4;
    const dark = Math.random() < 0.55;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = dark
      ? 'rgba(' + (86 + Math.random() * 46 | 0) + ',' + (76 + Math.random() * 40 | 0) + ',' + (58 + Math.random() * 36 | 0) + ',0.34)'
      : 'rgba(' + (236 + Math.random() * 19 | 0) + ',' + (226 + Math.random() * 19 | 0) + ',' + (204 + Math.random() * 25 | 0) + ',0.30)';
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3.5, 3.5);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function makeBubbleTexture() {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.35, 'rgba(200,238,255,0.22)');
  g.addColorStop(0.72, 'rgba(150,215,255,0.30)');
  g.addColorStop(0.90, 'rgba(235,250,255,0.55)');
  g.addColorStop(1.0, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ============================================================
   6. Резервуар: рама, стекло, песок, поверхность воды
   ============================================================ */
const frameMat = new THREE.MeshPhysicalMaterial({
  color: 0x191d22, roughness: 0.34, metalness: 0.9, envMapIntensity: 1.0
});

function frameEdge(a, b, t) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.BoxGeometry(t, t, len);
  const m = new THREE.Mesh(g, frameMat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.normalize());
  m.castShadow = true;
  scene.add(m);
}

(function buildFrame() {
  const x = TANK.w / 2, y = TANK.h / 2, z = TANK.d / 2;
  const t = 0.22;
  const c = [
    [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z],
    [-x, y, -z], [x, y, -z], [x, y, z], [-x, y, z]
  ].map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const pairs = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
  for (const p of pairs) frameEdge(c[p[0]], c[p[1]], t);

  // тумба
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(TANK.w + 0.9, 0.9, TANK.d + 0.9),
    new THREE.MeshPhysicalMaterial({ color: 0x10161c, roughness: 0.55, metalness: 0.25, envMapIntensity: 0.6 })
  );
  base.position.y = -y - 0.62;
  base.receiveShadow = true;
  scene.add(base);
})();

(function buildGlass() {
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xcbe9f7, transparent: true, opacity: 0.055, roughness: 0.03,
    metalness: 0.0, side: THREE.DoubleSide, depthWrite: false,
    envMapIntensity: 1.4, clearcoat: 1.0, clearcoatRoughness: 0.02
  });
  const W = TANK.w, H = TANK.h, D = TANK.d;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(W, H), glassMat);
  front.position.set(0, 0, D / 2);
  scene.add(front);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), glassMat);
  back.position.set(0, 0, -D / 2);
  scene.add(back);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(D, H), glassMat);
  left.position.set(-W / 2, 0, 0);
  left.rotation.y = Math.PI / 2;
  scene.add(left);
  const right = new THREE.Mesh(new THREE.PlaneGeometry(D, H), glassMat);
  right.position.set(W / 2, 0, 0);
  right.rotation.y = Math.PI / 2;
  scene.add(right);
})();

/* ---- песок ---- */
(function buildSand() {
  const sandTex = makeSandTexture();
  const geo = new THREE.PlaneGeometry(TANK.w * 0.99, TANK.d * 0.99, 150, 110);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let y = 0.44 * fbm(x * 0.22 + 5.5, z * 0.22 + 9.1, 4);
    y += 0.30 * Math.pow(Math.abs(z) / (TANK.d / 2), 2.4);
    y += 0.16 * Math.pow(Math.abs(x) / (TANK.w / 2), 2.2);
    pos.setY(i, y);
  }
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: sandTex, bumpMap: sandTex, bumpScale: 0.09,
    color: 0xd9cdb0, roughness: 0.92, metalness: 0.0, envMapIntensity: 0.55
  });
  addCaustics(mat, 0.85, 0xbfe9ff);
  const sand = new THREE.Mesh(geo, mat);
  sand.position.y = TANK.floor;
  sand.receiveShadow = true;
  scene.add(sand);
})();

/* ---- поверхность воды ---- */
(function buildSurface() {
  const mat = new THREE.ShaderMaterial({
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    uniforms: { uTime: timeUniform },
    vertexShader: `
      varying vec2 vUvW;
      void main() {
        vUvW = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUvW;
      void main() {
        vec2 p = vUvW * 46.0;
        float w = sin(p.x * 1.0 + uTime * 1.15)
                + sin(p.y * 0.78 - uTime * 0.92)
                + sin((p.x + p.y) * 1.45 + uTime * 1.7) * 0.7;
        float n = smoothstep(0.5, 1.9, abs(w));
        vec3 col = mix(vec3(0.04, 0.24, 0.34), vec3(0.62, 0.94, 1.0), n);
        float a = 0.20 + 0.45 * n;
        gl_FragColor = vec4(col, a);
      }`
  });
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(TANK.w - 0.08, TANK.d - 0.08, 1, 1), mat);
  surf.rotation.x = -Math.PI / 2;
  surf.position.y = TANK.h / 2 - 0.12;
  scene.add(surf);
})();

/* ============================================================
   7. Камни
   ============================================================ */
const rockMatBase = new THREE.MeshStandardMaterial({
  color: 0x726d63, roughness: 0.88, metalness: 0.03, envMapIntensity: 0.65
});
addCaustics(rockMatBase, 0.55, 0xa8dcf0);

function makeRockMaterial() {
  const m = new THREE.MeshStandardMaterial({
    color: 0x726d63, roughness: 0.88, metalness: 0.03, envMapIntensity: 0.65
  });
  addCaustics(m, 0.55, 0xa8dcf0);
  return m;
}

function makeRock(radius, seed) {
  const geo = new THREE.IcosahedronGeometry(radius, 4);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = fbm(v.x * 1.3 + seed, v.z * 1.25 + v.y * 0.9 + seed * 0.7, 4);
    const d = 0.70 + n * 0.62 + (fbm(v.x * 4.5, v.y * 4.5 + v.z * 3.1 + seed, 3) - 0.5) * 0.16;
    v.multiplyScalar(d);
    v.y *= 0.70;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mat = makeRockMaterial();
  mat.color.setHSL(0.10 + rnd() * 0.06, 0.10 + rnd() * 0.10, 0.30 + rnd() * 0.16);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

(function buildRocks() {
  const spots = [
    [-5.4, -0.4, 1.1, 0.9],
    [-3.6, 0.9, 0.8, 0.6],
    [4.9, -0.6, 1.0, 0.85],
    [3.2, 1.6, 0.7, 0.55],
    [0.4, -2.6, 0.55, 0.45],
    [-1.6, 1.9, 0.4, 0.42],
    [6.4, 2.2, 0.5, 0.5],
    [-6.6, 2.4, 0.45, 0.5]
  ];
  for (let i = 0; i < spots.length; i++) {
    const s = spots[i];
    const r = makeRock(s[3], i * 3.7 + 1.3);
    r.position.set(s[0], TANK.floor + s[2] * 0.42, s[1]);
    r.rotation.y = rnd() * Math.PI * 2;
    scene.add(r);
  }
  // мелкая галька
  const pebbleGeo = new THREE.IcosahedronGeometry(0.12, 1);
  const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x8a8579, roughness: 0.85, metalness: 0.02, envMapIntensity: 0.6 });
  addCaustics(pebbleMat, 0.7, 0xb8e4f5);

  const pebbles = new THREE.InstancedMesh(pebbleGeo, pebbleMat, 260);
  const mtx = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const sc = new THREE.Vector3();
  const ps = new THREE.Vector3();
  for (let i = 0; i < 260; i++) {
    ps.set(rr(-7.2, 7.2), TANK.floor + 0.02 + rnd() * 0.05, rr(-3.8, 3.8));
    q.setFromEuler(new THREE.Euler(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28));
    const s = rr(0.5, 1.5);
    sc.set(s, s * 0.7, s);
    mtx.compose(ps, q, sc);
    pebbles.setMatrixAt(i, mtx);
  }
  pebbles.castShadow = true;
  pebbles.receiveShadow = true;
  scene.add(pebbles);
})();

/* ============================================================
   8. Водоросли
   ============================================================ */
function makePlantGeometry(opts) {
  const count = opts.count || 18;
  const hMin = opts.hMin || 1.2, hMax = opts.hMax || 3.2;
  const radius = opts.radius || 0.7;
  const baseW = opts.width || 0.13;
  const leaf = !!opts.leaf;
  const SEG = leaf ? 14 : 11;

  const positions = [], uvs = [], hAttr = [], phaseAttr = [], colors = [];
  const colA = new THREE.Color(opts.colorA || 0x2d6b34);
  const colB = new THREE.Color(opts.colorB || 0x8cbf46);
  const tmpCol = new THREE.Color();

  for (let b = 0; b < count; b++) {
    const ang = rnd() * Math.PI * 2;
    const rad = Math.sqrt(rnd()) * radius;
    const bx = Math.cos(ang) * rad, bz = Math.sin(ang) * rad;
    const h = hMin + (hMax - hMin) * (0.30 + rnd() * 0.70);
    const curl = rr(0.15, 1.2);
    const dx = Math.cos(ang), dz = Math.sin(ang);
    const px = -dz, pz = dx;
    const phase = rnd() * Math.PI * 2;
    const w0 = baseW * (0.65 + rnd() * 0.8);
    const twist = rr(-0.5, 0.5);
    tmpCol.copy(colA).lerp(colB, clamp(rnd() * 0.9 + 0.05, 0, 1));

    const first = positions.length / 3;
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const y = h * Math.pow(t, 0.92);
      const off = curl * Math.pow(t, 2.0) * 0.95;
      const cx = bx + dx * off, cz = bz + dz * off;
      let wT;
      if (leaf) wT = w0 * Math.sin(Math.PI * Math.pow(t, 0.62)) * 2.1 + 0.01;
      else wT = w0 * (1 - 0.82 * t) * (1 + 0.25 * Math.sin(t * 5.0));
      const tilt = twist * Math.pow(t, 1.5) * 0.35;
      for (let s = -1; s <= 1; s += 2) {
        positions.push(cx + px * wT * s, y + tilt * s, cz + pz * wT * s);
        uvs.push((s + 1) * 0.5, t);
        hAttr.push(t);
        phaseAttr.push(phase);
        colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
      }
    }
    for (let i = 0; i < SEG; i++) {
      const a = first + i * 2;
      const idx = a, b1 = a + 1, c = a + 2, d = a + 3;
      const arr = [idx, b1, c, b1, d, c];
      arr.forEach(f => indexList.push(f));
    }
    // нормали считаем после сборки
  }
  return { positions, uvs, hAttr, phaseAttr, colors };
}

let indexList = [];
function buildPlant(opts) {
  indexList = [];
  const d = makePlantGeometry(opts);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(d.positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(d.uvs, 2));
  geo.setAttribute('aH', new THREE.Float32BufferAttribute(d.hAttr, 1));
  geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(d.phaseAttr, 1));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(d.colors, 3));
  geo.setIndex(indexList);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, side: THREE.DoubleSide,
    roughness: 0.62, metalness: 0.0, envMapIntensity: 0.7
  });
  addCaustics(mat, 0.35, 0x9fd8ee);
  const uSway = { value: opts.sway || 0.16 };
  mat.onBeforeCompile = ((orig) => (shader) => {
    if (orig) orig(shader);
    shader.uniforms.uTime = timeUniform;
    shader.uniforms.uSway = uSway;
    shader.vertexShader = 'attribute float aH;\nattribute float aPhase;\nuniform float uTime;\nuniform float uSway;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      {
        float hh = aH * aH;
        transformed.x += sin(uTime * 1.15 + aPhase) * uSway * hh;
        transformed.z += cos(uTime * 0.92 + aPhase * 1.3) * uSway * 0.7 * hh;
        transformed.y += sin(uTime * 1.7 + aPhase * 2.1) * uSway * 0.10 * hh;
      }`
    );
  })(mat.onBeforeCompile);
  mat.customProgramCacheKey = uniqueKey('plant');

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const H_KEYS = [[0, 0.02], [0.04, 0.42], [0.12, 0.79], [0.30, 1.0], [0.50, 0.92], [0.68, 0.70], [0.82, 0.42], [0.92, 0.22], [1.0, 0.05]];
const W_KEYS = [[0, 0.02], [0.04, 0.26], [0.14, 0.46], [0.32, 0.52], [0.55, 0.44], [0.75, 0.28], [0.90, 0.14], [1.0, 0.04]];

function buildFishBodyGeometry(len, H, W, segs, radial) {
  const positions = [], uvs = [], indices = [];
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const x = len * (0.5 - u);
    const h = H * profile(H_KEYS, u);
    const w = W * profile(W_KEYS, u);
    for (let j = 0; j <= radial; j++) {
      const th = (j / radial) * Math.PI * 2;
      positions.push(x, Math.cos(th) * h, Math.sin(th) * w);
      uvs.push(u, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j;
      const b = a + radial + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function rayFinGeometry(nU, nV, baseFn, edgeFn, bow) {
  const pos = [], uv = [], idx = [];
  const b = [0, 0, 0], e = [0, 0, 0];
  for (let j = 0; j <= nV; j++) {
    const v = j / nV;
    baseFn(v, b);
    edgeFn(v, e);
    for (let i = 0; i <= nU; i++) {
      const u = i / nU;
      const bw = Math.sin(Math.PI * u) * bow * Math.sin(v * Math.PI);
      pos.push(
        b[0] + (e[0] - b[0]) * u,
        b[1] + (e[1] - b[1]) * u,
        b[2] + (e[2] - b[2]) * u + bw
      );
      uv.push(u, v);
    }
  }
  for (let j = 0; j < nV; j++) {
    for (let i = 0; i < nU; i++) {
      const a = j * (nU + 1) + i;
      const b1 = a + 1, c = a + nU + 1, d = c + 1;
      idx.push(a, c, b1, b1, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aFinUv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- инъекции шейдеров --- */
function injectBend(shader, U) {
  shader.uniforms.uTime = timeUniform;
  shader.uniforms.uAmp = U.uAmp;
  shader.uniforms.uFreq = U.uFreq;
  shader.uniforms.uWavK = U.uWavK;
  shader.uniforms.uPhase = U.uPhase;
  shader.uniforms.uHeadX = U.uHeadX;

  shader.vertexShader = `
uniform float uTime;
uniform float uAmp;
uniform float uFreq;
uniform float uWavK;
uniform float uPhase;
uniform vec2 uHeadX;
` + shader.vertexShader;

  shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>', `
#include <beginnormal_vertex>
{
  float bt = clamp((uHeadX.x - position.x) / max(0.0001, uHeadX.x - uHeadX.y), 0.0, 1.0);
  float bamp = uAmp * pow(bt, 1.8);
  float bph = position.x * uWavK - uTime * uFreq + uPhase;
  float slope = cos(bph) * bamp * uWavK;
  float ca = cos(-slope);
  float sa = sin(-slope);
  objectNormal = vec3(objectNormal.x * ca + objectNormal.z * sa, objectNormal.y, -objectNormal.x * sa + objectNormal.z * ca);
}
`);

  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
#include <begin_vertex>
{
  float bt2 = clamp((uHeadX.x - position.x) / max(0.0001, uHeadX.x - uHeadX.y), 0.0, 1.0);
  float bamp2 = uAmp * pow(bt2, 1.8);
  float bph2 = position.x * uWavK - uTime * uFreq + uPhase;
  transformed.z += sin(bph2) * bamp2;
}
`);
}

function injectBodyPattern(shader, spec, len, H) {
  shader.uniforms.uBelly = { value: new THREE.Color(spec.belly) };
  shader.uniforms.uStripe = { value: new THREE.Color(spec.stripe) };
  shader.uniforms.uStripeFreq = { value: spec.stripeFreq || 0 };
  shader.uniforms.uStripeAmt = { value: spec.stripeAmt === undefined ? 0.5 : spec.stripeAmt };
  shader.uniforms.uStripeMode = { value: spec.stripeMode === undefined ? 1 : spec.stripeMode };
  shader.uniforms.uStripeCenter = { value: spec.stripeCenter === undefined ? 0.1 : spec.stripeCenter };
  shader.uniforms.uBodyH = { value: H };

  shader.vertexShader = 'varying float vLX;\nvarying float vLY;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    '#include <begin_vertex>\n  vLX = position.x;\n  vLY = position.y;'
  );

  shader.fragmentShader = `
varying float vLX;
varying float vLY;
uniform vec3 uBelly;
uniform vec3 uStripe;
uniform float uStripeFreq;
uniform float uStripeAmt;
uniform float uStripeMode;
uniform float uStripeCenter;
uniform float uBodyH;
` + shader.fragmentShader;

  shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
#include <color_fragment>
{
  float hN = clamp(vLY / max(0.0001, uBodyH), -1.2, 1.2);
  float belly = smoothstep(-0.02, -0.85, hN);
  diffuseColor.rgb = mix(diffuseColor.rgb, uBelly, belly * 0.85);

  float band = 0.0;
  if (uStripeMode < 1.5) {
    band = smoothstep(0.30, 0.95, sin(vLX * uStripeFreq));
  } else {
    float d = abs(hN - uStripeCenter);
    band = 1.0 - smoothstep(0.16, 0.5, d);
  }
  band *= uStripeAmt;
  band *= mix(0.45, 1.0, smoothstep(-1.1, -0.5, hN));
  diffuseColor.rgb = mix(diffuseColor.rgb, uStripe, clamp(band, 0.0, 1.0));

  vec2 sp = vec2(vLX * 44.0, vLY * 68.0);
  float row = floor(sp.y);
  sp.x += mod(row, 2.0) * 0.5;
  vec2 cell = fract(sp) - 0.5;
  float dcell = length(cell * vec2(1.0, 1.4));
  float sc = smoothstep(0.55, 0.12, dcell);
  diffuseColor.rgb *= 0.87 + 0.28 * sc;
}
`);
}

function injectFinPattern(shader) {
  shader.vertexShader = 'attribute vec2 aFinUv;\nvarying vec2 vFinUv;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
#include <begin_vertex>
vFinUv = aFinUv;
{
  float fl = sin(uTime * 5.2 + uPhase + aFinUv.y * 5.5);
  transformed.z += fl * 0.020 * pow(aFinUv.x, 2.0);
}
`);
  shader.fragmentShader = 'varying vec2 vFinUv;\n' + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
#include <color_fragment>
{
  float veins = smoothstep(0.70, 1.0, abs(cos(vFinUv.y * 3.14159 * 9.0)));
  diffuseColor.rgb *= 1.0 - 0.25 * veins * (0.35 + 0.65 * vFinUv.x);
  diffuseColor.a *= smoothstep(0.0, 0.10, vFinUv.x);
  diffuseColor.a *= 1.0 - 0.30 * pow(vFinUv.x, 3.0);
  diffuseColor.rgb *= mix(1.18, 0.85, vFinUv.x);
}
`);
}

  color: 0x05080c, roughness: 0.05, metalness: 0.0,

const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const eyeGeoCache = {};

function buildFish(spec, scale) {
  const len = spec.len, H = spec.height, W = spec.width;
  const root = new THREE.Group();

  const U = {
    uPhase: { value: rnd() * 6.283 },
    uFreq: { value: spec.baseFreq },
    uAmp: { value: spec.amp },
    uWavK: { value: spec.wavK },
    uHeadX: { value: new THREE.Vector2(len * 0.5, -(len * 0.5 + spec.tailLen * 1.25)) }
  };

  /* тело */
  const bodyGeo = buildFishBodyGeometry(len, H, W, 80, 30);
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: spec.color,
    roughness: spec.rough, metalness: spec.metalness,
    clearcoat: 0.65, clearcoatRoughness: 0.22,
    iridescence: spec.iridescence, iridescenceIOR: 1.32,
    iridescenceThicknessRange: [120, 520],
    sheen: 0.45, sheenColor: new THREE.Color(spec.sheen), sheenRoughness: 0.55,
    envMapIntensity: 1.15
  });
  bodyMat.onBeforeCompile = (shader) => {
    injectBend(shader, U);
    injectBodyPattern(shader, spec, len, H);
  };
  bodyMat.customProgramCacheKey = uniqueKey('fishBody');
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  root.add(body);

  /* плавники */
  const finMat = new THREE.MeshPhysicalMaterial({
    color: spec.finColor, roughness: 0.45, metalness: 0.02,
    transparent: true, opacity: spec.finOpacity, side: THREE.DoubleSide,
    depthWrite: false, clearcoat: 0.35, clearcoatRoughness: 0.3,
    sheen: 0.7, sheenColor: new THREE.Color(spec.sheen), sheenRoughness: 0.6,
    envMapIntensity: 1.1
  });
  finMat.onBeforeCompile = (shader) => {
    injectBend(shader, U);
    injectFinPattern(shader);
  };
  finMat.customProgramCacheKey = uniqueKey('fishFin');

  const topY = (x) => H * profile(H_KEYS, clamp(0.5 - x / len, 0, 1));

  /* хвост */
  const tailX = -len * 0.5;
  const tailGeo = rayFinGeometry(16, 22,
    (v, out) => { out[0] = tailX; out[1] = (v * 2 - 1) * H * 0.10; out[2] = 0; },
    (v, out) => {
      const s = v * 2 - 1;
      const forkf = 1.0 + 0.45 * spec.tailFork * (Math.pow(Math.abs(s), 1.25) - 0.35);
      out[0] = tailX - spec.tailLen * forkf;
      out[1] = s * spec.tailSpread;
      out[2] = 0;
    }, 0.035);
  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.castShadow = true;
  root.add(tail);

  /* спинной */
  const d0 = len * 0.15, d1 = -len * 0.38;
  const dorsalGeo = rayFinGeometry(14, 20,
    (v, out) => { const x = d0 + (d1 - d0) * v; out[0] = x; out[1] = topY(x) * 0.86; out[2] = 0; },
    (v, out) => {
      const x = d0 + (d1 - d0) * v;
      const prof = Math.sin(Math.PI * clamp(0.14 + 0.92 * v, 0, 1));
      out[0] = x - len * 0.06 * v;
      out[1] = topY(x) * 0.86 + spec.dorsalH * prof;
      out[2] = 0;
    }, 0.02);
  root.add(new THREE.Mesh(dorsalGeo, finMat));

  /* анальный */
  const a0 = -len * 0.03, a1 = -len * 0.40;
  const analGeo = rayFinGeometry(12, 18,
    (v, out) => { const x = a0 + (a1 - a0) * v; out[0] = x; out[1] = -topY(x) * 0.82; out[2] = 0; },
    (v, out) => {
      const x = a0 + (a1 - a0) * v;
      const prof = Math.sin(Math.PI * clamp(0.18 + 0.88 * v, 0, 1));
      out[0] = x + len * 0.03 * v;
      out[1] = -topY(x) * 0.82 - spec.analH * prof;
      out[2] = 0;
    }, 0.018);
  root.add(new THREE.Mesh(analGeo, finMat));

  /* грудные */
  const pecs = [];
  const pecGeo = rayFinGeometry(8, 12,
    (v, out) => { out[0] = 0; out[1] = (v - 0.5) * H * 0.22; out[2] = 0; },
    (v, out) => {
      out[0] = -spec.pecLen * (0.75 + 0.25 * Math.cos((v - 0.5) * Math.PI));
      out[1] = (v - 0.5) * spec.pecLen * 0.62;
      out[2] = 0;
    }, 0.012);
  const uEye = 0.30;
  const px = len * (0.5 - uEye);
  const hAt = H * profile(H_KEYS, uEye);
  const wAt = W * profile(W_KEYS, uEye);
  for (const side of [-1, 1]) {
    const pec = new THREE.Mesh(pecGeo, finMat);
    pec.position.set(px, -hAt * 0.05, side * wAt * 0.86);
    pec.rotation.y = side * Math.PI * 0.5;
    pec.rotation.z = side * 0.35;
    root.add(pec);
    pecs.push({ mesh: pec, base: side * Math.PI * 0.5, sign: side });
  }

  /* глаза */
  const er = Math.max(0.022, H * 0.19);
  let eyeGeo = eyeGeoCache[er.toFixed(3)];
  if (!eyeGeo) { eyeGeo = new THREE.SphereGeometry(er, 18, 14); eyeGeoCache[er.toFixed(3)] = eyeGeo; }
  const glintGeo = new THREE.SphereGeometry(er * 0.26, 8, 8);
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(px, hAt * 0.30, side * wAt * 0.80);
    root.add(eye);
    const gl = new THREE.Mesh(glintGeo, glintMat);
    gl.position.set(px + er * 0.55, hAt * 0.30 + er * 0.45, side * (wAt * 0.80 + er * 0.62));
    root.add(gl);
  }

  root.scale.setScalar(scale * (spec.scaleBase || 1));
  return { root, U, pecs, spec };
}

/* --- поведение --- */
class Fish {
  constructor(spec) {
    const scale = rr(spec.scaleRange[0], spec.scaleRange[1]);
    const built = buildFish(spec, scale);
    this.obj = built.root;
    this.U = built.U;
    this.pecs = built.pecs;
    this.spec = spec;
    this.speed = rr(spec.speed[0], spec.speed[1]);
    this.pos = new THREE.Vector3(rr(BOUNDS.x0 + 1, BOUNDS.x1 - 1), rr(BOUNDS.y0 + 0.8, BOUNDS.y1 - 0.8), rr(BOUNDS.z0 + 0.8, BOUNDS.z1 - 0.8));
    this.vel = new THREE.Vector3(rr(-0.5, 0.5), rr(-0.1, 0.1), rr(-0.4, 0.4));
    this.lane = rr(BOUNDS.y0 + 0.7, BOUNDS.y1 - 0.7);
    this.target = this.pos.clone();
    this.timer = rr(0, 3);
    this.obj.position.copy(this.pos);
    this.quat = new THREE.Quaternion();
    this._m = new THREE.Matrix4();
    this._x = new THREE.Vector3();
    this._y = new THREE.Vector3();
    this._z = new THREE.Vector3();
    this._up = new THREE.Vector3(0, 1, 0);
    this._q = new THREE.Quaternion();
    this._roll = new THREE.Quaternion();
    this.speedNorm = 0.5;
    scene.add(this.obj);
  }

  pickTarget() {
    this.target.set(
      rr(BOUNDS.x0 + 0.9, BOUNDS.x1 - 0.9),
      clamp(this.lane + rr(-1.1, 1.1), BOUNDS.y0 + 0.5, BOUNDS.y1 - 0.5),
      rr(BOUNDS.z0 + 0.9, BOUNDS.z1 - 0.9)
    );
  }

  update(dt, foods) {
    this.timer -= dt;

    let chase = null, chaseDist = 1e9;
    if (foods && foods.length) {
      for (let i = 0; i < foods.length; i++) {
        const f = foods[i];
        const d = f.mesh.position.distanceToSquared(this.pos);
        if (d < chaseDist && d < 49) { chaseDist = d; chase = f; }
      }
    }

    if (chase) {
      this.target.copy(chase.mesh.position);
      if (chaseDist < 0.18) {
        chase.dead = true;
      }
    } else if (this.timer <= 0 || this.pos.distanceToSquared(this.target) < 0.8) {
      this.pickTarget();
      this.timer = rr(2.5, 6.5);
    }

    const desired = this.target.clone().sub(this.pos);
    const dist = desired.length();
    const boost = chase ? 1.6 : (dist > 3.2 ? 1.3 : 1.0);
    if (dist > 1e-4) desired.multiplyScalar(this.speed * boost / dist);

    // отталкивание от стенок
    const m = 1.5;
    const avoid = new THREE.Vector3();
    if (this.pos.x > BOUNDS.x1 - m) avoid.x -= (this.pos.x - (BOUNDS.x1 - m)) * 1.5;
    if (this.pos.x < BOUNDS.x0 + m) avoid.x += ((BOUNDS.x0 + m) - this.pos.x) * 1.5;
    if (this.pos.y > BOUNDS.y1 - m) avoid.y -= (this.pos.y - (BOUNDS.y1 - m)) * 1.5;
    if (this.pos.y < BOUNDS.y0 + m) avoid.y += ((BOUNDS.y0 + m) - this.pos.y) * 1.5;
    if (this.pos.z > BOUNDS.z1 - m) avoid.z -= (this.pos.z - (BOUNDS.z1 - m)) * 1.5;
    if (this.pos.z < BOUNDS.z0 + m) avoid.z += ((BOUNDS.z0 + m) - this.pos.z) * 1.5;
    desired.add(avoid);

    const k = 1 - Math.exp(-dt * 1.7);
    this.vel.lerp(desired, k);

    const sp = this.vel.length();
    const maxSp = this.speed * (chase ? 1.9 : 1.5);
    if (sp > maxSp) this.vel.multiplyScalar(maxSp / sp);
    if (sp < 0.04 && dist > 0.5) this.vel.addScaledVector(desired, 0.02);

    this.pos.addScaledVector(this.vel, dt);
    this.pos.x = clamp(this.pos.x, BOUNDS.x0, BOUNDS.x1);
    this.pos.y = clamp(this.pos.y, BOUNDS.y0, BOUNDS.y1);
    this.pos.z = clamp(this.pos.z, BOUNDS.z0, BOUNDS.z1);
    this.obj.position.copy(this.pos);

    // ориентация
    const fwd = this.vel.lengthSq() > 1e-6 ? this.vel.clone().normalize() : new THREE.Vector3(1, 0, 0);
    this._x.copy(fwd);
    this._z.crossVectors(this._x, this._up);
    if (this._z.lengthSq() < 1e-6) this._z.set(0, 0, 1);
    this._z.normalize();
    this._y.crossVectors(this._z, this._x).normalize();
    this._m.makeBasis(this._x, this._y, this._z);
    this._q.setFromRotationMatrix(this._m);

    // крен на поворотах
    const prevFwd = this._prevFwd || fwd;
    const cross = prevFwd.clone().cross(fwd).y;
    this._prevFwd = fwd;
    this._roll.setFromAxisAngle(new THREE.Vector3(1, 0, 0), clamp(-cross * 6.0, -0.5, 0.5));
    this._q.multiply(this._roll);

    this.obj.quaternion.slerp(this._q, 1 - Math.exp(-dt * 5.5));

    // анимация плавания
    const sn = clamp(this.vel.length() / Math.max(0.001, this.speed), 0, 2);
    this.speedNorm += (sn - this.speedNorm) * (1 - Math.exp(-dt * 3));
    this.U.uFreq.value = this.spec.baseFreq * (0.55 + this.speedNorm * 0.85);
    this.U.uAmp.value = this.spec.amp * (0.65 + this.speedNorm * 0.75);

    const t = timeUniform.value;
    for (const p of this.pecs) {
      p.mesh.rotation.y = p.base + Math.sin(t * 4.2 + p.sign * 1.3) * 0.30 * (0.4 + this.speedNorm);
      p.mesh.rotation.z = p.sign * 0.35 + Math.sin(t * 3.1) * 0.10;
    }
  }
}

const fishes = [];
for (const spec of SPECIES) {
  for (let i = 0; i < spec.count; i++) {
    fishes.push(new Fish(spec));
  }
}

/* ============================================================
   10. Пузырьки (GPU-анимация)
   ============================================================ */
(function buildBubbles() {
  const N = 420;
  const positions = new Float32Array(N * 3);
  const seeds = new Float32Array(N);
  const speeds = new Float32Array(N);
  const sizes = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const cluster = i % 3;
    const cx = cluster === 0 ? -5.9 : (cluster === 1 ? 5.8 : 0.2);
    const cz = cluster === 0 ? -2.2 : (cluster === 1 ? -2.4 : -3.0);
    positions[i * 3 + 0] = cx + rr(-0.16, 0.16);
    positions[i * 3 + 1] = 0;
    positions[i * 3 + 2] = cz + rr(-0.16, 0.16);
    seeds[i] = Math.random();
    speeds[i] = rr(0.7, 1.5);
    sizes[i] = rr(0.6, 2.2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(seeds, 1));
  geo.setAttribute('aSpeed', new THREE.Float32BufferAttribute(speeds, 1));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: timeUniform,
      uTex: { value: makeBubbleTexture() },
      uBottom: { value: TANK.floor + 0.1 },
      uHeight: { value: TANK.h - 0.3 }
    },
    vertexShader: `
      attribute float aSeed;
      attribute float aSpeed;
      attribute float aSize;
      uniform float uTime;
      uniform float uBottom;
      uniform float uHeight;
      varying float vA;
      void main() {
        float life = fract(aSeed + uTime * aSpeed * 0.055);
        vec3 p = position;
        p.y = uBottom + life * uHeight;
        p.x += sin(uTime * 1.7 + aSeed * 31.0) * 0.16 * life;
        p.z += cos(uTime * 1.35 + aSeed * 23.0) * 0.16 * life;
        vA = smoothstep(0.0, 0.05, life) * (1.0 - smoothstep(0.85, 1.0, life));
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = aSize * 13.0 * (10.0 / max(1.0, -mv.z));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vA;
      void main() {
        vec4 c = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(c.rgb, c.a * vA * 0.75);
      }`
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
})();

/* ============================================================
   11. Корм
   ============================================================ */
const foods = [];
const foodGeo = new THREE.SphereGeometry(0.045, 8, 6);
const foodMat = new THREE.MeshStandardMaterial({
  color: 0xb9793a, roughness: 0.8, metalness: 0.0,
  emissive: new THREE.Color(0x2a1405), emissiveIntensity: 0.6
});

function feed() {
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(foodGeo, foodMat);
    m.position.set(rr(-2.0, 2.0), TANK.h / 2 - 0.35, rr(-2.0, 2.0));
    m.scale.setScalar(rr(0.6, 1.3));
    scene.add(m);
    foods.push({
      mesh: m,
      vel: new THREE.Vector3(rr(-0.12, 0.12), rr(-0.42, -0.16), rr(-0.12, 0.12)),
      life: rr(22, 34),
      dead: false
    });
  }
}

function updateFood(dt) {
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    f.life -= dt;
    if (f.dead || f.life <= 0) {
      scene.remove(f.mesh);
      foods.splice(i, 1);
      continue;
    }
    f.mesh.position.addScaledVector(f.vel, dt);
    f.vel.y += -0.06 * dt;
    f.vel.x += Math.sin(timeUniform.value * 2.0 + f.life) * 0.02 * dt;
    const floorY = TANK.floor + 0.15;
    if (f.mesh.position.y < floorY) {
      f.mesh.position.y = floorY;
      f.vel.multiplyScalar(0.0);
    }
  }
}

/* ============================================================
   12. UI
   ============================================================ */
let paused = false;
const btnFeed = document.getElementById('btnFeed');
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');

btnFeed.addEventListener('click', feed);
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Продолжить' : 'Пауза';
});
btnReset.addEventListener('click', () => {
  camera.position.set(0.6, 1.6, 18.5);
  controls.target.set(0, 0.1, 0);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); feed(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   13. Цикл
   ============================================================ */
const clock = new THREE.Clock();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if (!paused) {
    timeUniform.value += dt;
    updateFood(dt);
    for (let i = 0; i < fishes.length; i++) fishes[i].update(dt, foods);
  }
  controls.update();
  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const ov = document.getElementById('overlay');
    ov.classList.add('hide');
    setTimeout(() => { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 800);
  }
}

window.addEventListener('error', (e) => {
  const ov = document.getElementById('overlay');
  if (ov) {
    ov.classList.remove('hide');
    document.getElementById('overlayText').textContent =
      'Ошибка инициализации. Нужен интернет для загрузки three.js с CDN. ' + (e.message || '');
  }
});

animate();
